name: Daily Binance BTC Sync

on:
  schedule:
    # Runs automatically every day at 00:05 UTC (shortly after daily candle close)
    - cron: '5 0 * * *'
  # Allows you to manually trigger the workflow from the GitHub UI anytime
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Binance Sync Script
        run: |
          python btcpriceupdate.py

      - name: Commit and push updated database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add crypto_historical_data.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily btc candle update from binance" && git push)
